[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "titanic_ml_project"
version = "0.0.1"
description = "This is my project for titanic"
authors = [
  { name = "Elaine Sene" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["titanic_ml_project"]
include = ["pyproject.toml", "titanic_ml_project/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["titanic_ml_project"]
force-sort-within-sections = true

